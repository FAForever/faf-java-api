name: Build
on: [ push, pull_request ]
jobs:
  test:
    runs-on: ubuntu-latest
    container: eclipse-temurin:25-jdk
    steps:
      - name: Get the version
        id: get_version
        run: |
          if echo $GITHUB_REF | grep -Eq '^refs\/tags\/.*'; then
              echo ::set-output name=API_VERSION::${GITHUB_REF#refs/tags/}
          else
              echo ::set-output name=API_VERSION::${GITHUB_SHA}
          fi
      - name: Install tools
        run: apt update && apt install -y git wget curl gpg
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Gradle build
        env:
          API_VERSION: ${{ steps.get_version.outputs.API_VERSION }}
          GRADLE_CLI_OPTS: ""
        run: "chmod +x ./gradlew && ./gradlew ${GRADLE_CLI_OPTS} -Pversion=${API_VERSION} build jacocoTestReport"
      - name: Upload application jar
        if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags')
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: build/libs/faf-java-api-*.jar
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          name: codecov

  docker:
    needs: test
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download application jar
        uses: actions/download-artifact@v8
        with:
          name: application-jar
          path: build/libs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: faforever/faf-java-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
      - name: Build and push Docker images
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
